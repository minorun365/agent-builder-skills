<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ブラウザ、CloudFront、Lambda Web Adapter、Cognito、AgentCore Runtime、Amazon Bedrock の構成図" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif">
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0d6a"/>
      <stop offset="0.45" stop-color="#0a4695"/>
      <stop offset="0.68" stop-color="#0862aa"/>
      <stop offset="1" stop-color="#01b6ec"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0862aa"/>
    </marker>
    <marker id="arrowMuted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#767680"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="500" rx="16" fill="#ffffff"/>

  <!-- 実在する境界：AWS アカウント -->
  <rect x="222" y="24" width="714" height="452" rx="14" fill="none" stroke="#b9c6d6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="240" y="50" font-size="12" font-weight="700" fill="#767680" letter-spacing="0.6">AWS アカウント ／ すべて AWS CDK で定義</text>

  <!-- ブラウザ -->
  <rect x="24" y="195" width="150" height="120" rx="12" fill="#f7f8fa" stroke="#e8e8ee" stroke-width="1.5"/>
  <text x="40" y="240" font-size="15" font-weight="700" fill="#15151a">ブラウザ</text>
  <text x="40" y="264" font-size="12" fill="#4a4a54">React（Vite）の画面</text>

  <!-- ① 画面を取得 -->
  <path d="M174 225 H196 V110 H330" fill="none" stroke="#0862aa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="236" y="101" font-size="12" font-weight="700" fill="#0a4695" stroke="#ffffff" stroke-width="5" paint-order="stroke fill">① 画面を取得</text>

  <!-- ② サインイン -->
  <path d="M174 255 H330" fill="none" stroke="#0862aa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="236" y="246" font-size="12" font-weight="700" fill="#0a4695" stroke="#ffffff" stroke-width="5" paint-order="stroke fill">② サインイン</text>

  <!-- ③ エージェントを直接呼び出す -->
  <path d="M174 285 H196 V405 H330" fill="none" stroke="#0862aa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="236" y="396" font-size="12" font-weight="700" fill="#0a4695" stroke="#ffffff" stroke-width="5" paint-order="stroke fill">③ 直接呼び出し</text>

  <!-- CloudFront -->
  <rect x="330" y="70" width="170" height="80" rx="12" fill="#eaf2fb" stroke="#cfe0f2" stroke-width="1.5"/>
  <text x="346" y="104" font-size="15" font-weight="700" fill="#0e0d6a">CloudFront</text>
  <text x="346" y="128" font-size="12" fill="#4a4a54">配信とキャッシュ</text>

  <path d="M500 110 H560" fill="none" stroke="#0862aa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Lambda Web Adapter -->
  <rect x="560" y="60" width="284" height="100" rx="12" fill="#eaf2fb" stroke="#cfe0f2" stroke-width="1.5"/>
  <text x="576" y="92" font-size="15" font-weight="700" fill="#0e0d6a">Lambda Web Adapter</text>
  <text x="576" y="116" font-size="12" fill="#4a4a54">Lambda コンテナ上の Node 配信サーバー</text>
  <text x="576" y="138" font-size="12" fill="#4a4a54">Function URL を OAC で保護</text>

  <!-- Cognito -->
  <rect x="330" y="215" width="200" height="80" rx="12" fill="#eaf2fb" stroke="#cfe0f2" stroke-width="1.5"/>
  <text x="346" y="249" font-size="15" font-weight="700" fill="#0e0d6a">Cognito</text>
  <text x="346" y="273" font-size="12" fill="#4a4a54">Google ／ メール＋パスキー</text>

  <!-- AgentCore が Cognito のトークンを検証 -->
  <path d="M430 360 V295" fill="none" stroke="#767680" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowMuted)"/>
  <text x="442" y="333" font-size="12" fill="#767680">トークンを検証</text>

  <!-- AgentCore Runtime（図の重心） -->
  <rect x="330" y="360" width="230" height="90" rx="12" fill="url(#blueGrad)"/>
  <text x="346" y="392" font-size="15" font-weight="700" fill="#ffffff">AgentCore Runtime</text>
  <text x="346" y="415" font-size="12" fill="#ffffff">Strands Agents のコンテナ</text>
  <text x="346" y="435" font-size="12" fill="#ffffff">JWT で保護・SSE で応答</text>

  <path d="M560 405 H640" fill="none" stroke="#0862aa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Amazon Bedrock -->
  <rect x="640" y="365" width="180" height="80" rx="12" fill="#eaf2fb" stroke="#cfe0f2" stroke-width="1.5"/>
  <text x="656" y="399" font-size="15" font-weight="700" fill="#0e0d6a">Amazon Bedrock</text>
  <text x="656" y="423" font-size="12" fill="#4a4a54">モデルの推論</text>
</svg>
